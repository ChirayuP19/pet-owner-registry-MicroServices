spring:
  application:
    name: PawStack
  datasource:
    url: jdbc:postgresql://localhost:5432/pawstack
    username: ${USERNAME}
    password: ${PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
    username: ${SYSTEM_EMAIL_ID}
    password: ${SYSTEM_EMAIL_PASSWORD}
server:
  port: 9000
