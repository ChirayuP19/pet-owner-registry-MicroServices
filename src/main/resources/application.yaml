spring:
  application:
    name: PawStack
  datasource:
    url: jdbc:postgresql://localhost:5432/pawstack
    username: ${USERNAME}
    password: ${PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
server:
  port: 9000
